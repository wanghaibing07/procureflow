[project]
name = "procureflow"
version = "0.1.0"
description = "Inventory replenishment and purchase approval lab"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "pydantic>=2.10,<3",
    "pymysql[rsa]>=1.1,<2",
    "sqlalchemy>=2.0,<2.1",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["pytest>=8.3,<10"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
